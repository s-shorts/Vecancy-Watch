name: Check vacancies

on:
  schedule:
    - cron: "17 0,6,12,18 * * *"   # every 6 hours (05:47, 11:47, 17:47, 23:47 IST)
  workflow_dispatch: {}             # "Run workflow" button = check now
  push:
    branches: [main]
    paths: ["config.json", "vacancywatch/**", "web/**", "github_run.py", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vacancywatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install flask requests beautifulsoup4 pypdf

      - name: Check all institution websites
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python github_run.py

      - name: Save history
        run: |
          git config user.name "vacancywatch-bot"
          git config user.email "vacancywatch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Vacancy check $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')"
          git pull --rebase --autostash origin main || true
          git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
